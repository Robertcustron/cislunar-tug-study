[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cislunar-tug"
version = "0.1.0"
description = "Traceable Phase 0/A calculations for a reusable cislunar electric cargo tug"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
cislunar-tug = "cislunar_tug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
