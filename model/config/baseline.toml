# ------------------------------------------------ logical architecture (power budget)
[parameters.design_ep_power]
value = 25000.0
unit = "W"
ref = "D-16"
source = "Trade-offs decision: EP power at the PPU inputs at end of life"

[parameters.staging_perigee_altitude]
value = 250.0
unit = "km"
ref = "D-02"
source = "Ariane 6 reference GTO, 250 x 35,786 km (TBC against the user's manual)"

[parameters.staging_apogee_altitude]
