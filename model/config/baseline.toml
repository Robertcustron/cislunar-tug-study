[parameters.distribution_efficiency]
value = 0.95
unit = "-"
ref = "A-30"
source = "Own estimate: array regulation, distribution and harness losses"

[parameters.battery_dod]
value = 0.60
unit = "-"
ref = "A-31"
source = "Own estimate: Li-ion battery cycled a few thousand times over 15 years"

[parameters.battery_efficiency]
value = 0.95
unit = "-"
ref = "A-31"
source = "Own estimate: discharge efficiency, also used for charge"

[parameters.array_eol_bol_ratio]
value = 0.75
unit = "-"
ref = "A-32"
source = "Own estimate: 15 years with two radiation-belt crossings per round trip; TBC by the dose analysis of PWR-02"

[parameters.xenon_transfer_time]
value = 21.0
unit = "days"
