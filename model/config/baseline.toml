# ------------------------------------------------ power trade-off
[parameters.ep_specific_mass]
value = 25.0
unit = "kg/kW"
ref = "A-23"
source = "Own estimate: added dry mass per extra kW of EP power (arrays, PPUs, thrusters, radiators, structure); swept 15-40 kg/kW"

[parameters.platform_power]
value = 2000.0
unit = "W"
ref = "A-21"
source = "Own estimate (system analysis), TBC in the logical architecture"

[parameters.european_thruster_unit_power]
value = 5000.0
unit = "W"
ref = "A-24"
source = "PPS 5000 class, 5 kW (public catalogue listing, satcatalog.com); flown European Hall thruster class"

[parameters.european_thruster_rated_life]
value = 15000.0
unit = "hours"
ref = "A-24"
