[parameters.direct_carrier_isp]
value = 300.0
unit = "s"
ref = "A-36"
source = "Own estimate, bipropellant"

[parameters.thruster_rated_life_alt]
value = 20000.0
unit = "hours"
ref = "A-38"
source = "PPS 5000 operating life about 20,000 h per the Safran representative's product page; 15,000 h per satcatalog (A-24 baseline)"

# ------------------------------------------------ trade study settings
[trades]
# Thrust levels for the power vs transfer time table (MDN §6.3; the trade-offs extend this)
thrust_levels_n = [1.05, 1.5, 2.0, 3.0]
# (round trips, within years) targets for the inverse "power needed" question
trip_targets = [[10, 15.0], [8, 10.0]]
# One-at-a-time sensitivity ranges
cargo_outbound_kg = [3000.0, 4000.0, 5000.0, 6000.0, 7000.0, 8500.0]
dv_per_leg_base_m_s = [2400.0, 2750.0, 3100.0]
# Power trade-off: EP input power levels [kW] and specific-mass sensitivity [kg/kW]
power_levels_kw = [12.0, 15.0, 18.0, 20.0, 22.0, 24.0, 25.0, 26.0, 30.0, 36.0, 42.0, 48.0]
ep_specific_mass_kg_per_kw = [15.0, 25.0, 40.0]
# Spare thruster policy (A-27): "rotation" = the N+1 units take turns, each fires
# N/(N+1) of the thrusting time; "cold" = the spare only fires after a failure.
spare_policy = "rotation"
# TRL and cost assessment: rated string lives to compare [hours] (A-24, A-38 and long-life targets; the 12 kW class is added from its own parameters)
life_options_h = [15000.0, 20000.0, 50000.0, 75000.0]
# Cargo per trip cases for the launch campaign comparison [kg] (A-01 baseline, D-30)
campaign_cargo_kg = [5000.0, 6500.0, 7000.0]
