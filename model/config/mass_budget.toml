# Dry mass budget of the logical architecture, bottom-up by logical component.
#
# Each line: mass [kg] (nominal, no margin), maturity category and its basis.
# Categories follow the ESA margin philosophy for assessment studies
# (SRE-PA/2011.097, issue 1.3): "AB" off-the-shelf 5 %, "C" minor modification
# 10 %, "D" new or major modification 20 %. The 20 % system margin on top is in
# baseline.toml (mass_system_margin). Values are own estimates unless the basis
# names a public source (A-34).

[meta]
budget = "Dry mass by logical component"
document = "TRL and cost assessment"
unit = "kg"

[categories]
AB = 0.05
C = 0.10
D = 0.20

[[items]]
lc = "LC-1"
item = "Hall thrusters, 6 x 15 kg"
mass = 90
category = "C"
basis = "Scaled from AEPS (< 47 kg for 12.5 kW, L3Harris data sheet), about 3.8 kg/kW; PPS 5000 mass not public"
string = true

